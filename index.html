<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Formula Runner 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui">
      <section id="title" class="screen">
        <p class="kicker">Formula Runner 2.0</p>
        <h1>Floor it.<br />Don't stop.</h1>
        <p class="best" id="best">0 · 0 m</p>
        <div id="cars" class="cars"></div>
        <button id="play" class="primary">Race</button>
        <button id="openSettings" class="ghost">Settings</button>
        <p class="help">A/D or arrows to steer · S to brake · Space to boost · Esc pause<br />On touch: drag to steer</p>
      </section>

      <section id="hud" class="hud hidden">
        <div class="hud-left">
          <div class="speed"><span id="speed">0</span><small>KPH</small></div>
          <div class="boost"><span id="boostFill"></span></div>
        </div>
        <div class="hud-right">
          <div id="score">0</div>
          <div id="distance">0 m</div>
          <div id="zone">Harbor Lights</div>
          <button id="pauseHud" class="ghost hud-pause">Pause</button>
        </div>
        <div id="combo" class="combo"></div>
        <div id="toast" class="toast"></div>
      </section>

      <div id="countdown" class="countdown hidden">3</div>

      <section id="pause" class="screen overlay hidden">
        <h2>Paused</h2>
        <button id="resume" class="primary">Resume</button>
        <button id="quit" class="ghost">Quit to title</button>
      </section>

      <section id="results" class="screen overlay hidden">
        <p class="kicker" id="resultBest">Run complete</p>
        <h2 id="resultScore">0</h2>
        <p id="resultStats"></p>
        <button id="again" class="primary">Race again</button>
        <button id="menu" class="ghost">Title</button>
      </section>

      <section id="settings" class="screen overlay hidden">
        <h2>Settings</h2>
        <label>SFX <input id="sfx" type="range" min="0" max="1" step="0.01" /></label>
        <label>Music <input id="music" type="range" min="0" max="1" step="0.01" /></label>
        <label class="check"><input id="motion" type="checkbox" /> Reduced motion</label>
        <label class="check"><input id="haptics" type="checkbox" /> Haptics</label>
        <button id="closeSettings" class="primary">Done</button>
      </section>

      <div id="touch" class="touch hidden">
        <button id="brakeBtn">Brake</button>
        <button id="boostBtn">Boost</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
